    <script>
        function applyTitleStyles() {
            document.querySelectorAll('h1, h2, h3, h4, .logo-mc, .stat-num, .about-big').forEach(element => {
                const words = element.textContent.replace(/\s+/g, ' ').trim().split(' ').filter(Boolean);
                if (words.length === 2) {
                    element.classList.add('title-dual');
                }
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', applyTitleStyles);
        } else {
            applyTitleStyles();
        }
    </script>
